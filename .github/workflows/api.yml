# The api: lint, type check and tests (the OpenAPI document is checked by the tests). The environment is the lock
# file's (api/uv.lock), with idtrack at the commit set in api/pyproject.toml.
name: api

on:
  push:
    branches: [main]
    paths: ["api/**", "data/**", "scripts/**", "web/scripts/fixtures/**", "README.md", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "data/**", "scripts/**", "web/scripts/fixtures/**", "README.md", ".github/workflows/api.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - run: uv sync --locked --python 3.14
      # The package, its tests and the repository's Python scripts (SETUP.md, "Test"; scripts/check.sh runs the same).
      - name: ruff format
        run: uv run --no-sync ruff format --check . ../scripts ../web/scripts/fixtures
      - name: ruff
        run: uv run --no-sync ruff check . ../scripts ../web/scripts/fixtures
      - name: shellcheck (the shell scripts of deploy/ and scripts/)
        run: uv run --no-sync shellcheck --external-sources ../deploy/*.sh ../deploy/vm/*.sh ../scripts/*.sh

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - run: uv sync --locked --python 3.14
      - name: mypy
        run: uv run --no-sync mypy

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - run: uv sync --locked --python ${{ matrix.python }}
      # The tests marked `real` need the real graphs (IDTRACK_WEB_TEST_GRAPHS) and are skipped here.
      - run: uv run --no-sync pytest -q -rs
