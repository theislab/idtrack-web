# Caddy's settings for idtrack-web without containers (SETUP.md, section 12): the site's domain, and the api on this
# machine in place of the compose service `api`. A drop-in of the service of Caddy's own package:
#   sudo install -D -m 644 deploy/systemd/caddy-idtrack-web.conf /etc/systemd/system/caddy.service.d/idtrack-web.conf
#   (then put the domain in place of <domain> in that file)
#   sudo install -m 644 deploy/Caddyfile /etc/caddy/Caddyfile && sudo systemctl daemon-reload && sudo systemctl restart caddy
[Service]
Environment=IDTRACK_WEB_DOMAIN=<domain>
Environment=IDTRACK_WEB_UPSTREAM=127.0.0.1:8000
