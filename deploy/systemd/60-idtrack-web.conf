# Kernel settings for Caddy in front of idtrack-web on a machine without containers (SETUP.md, section 12): the api
# closes every connection after its answer, so Caddy opens one per request, and each leaves a socket waiting out
# TCP's TIME_WAIT (60 s). With Linux's default 28,232 local ports that caps the rate at about 470 requests a second,
# past which Caddy answers 502 ("cannot assign requested address": measured at 560 a second on the virtual machine).
# Reusing such sockets for new connections (safe with TCP timestamps) and the wider port range lift the cap; the
# compose file sets the same in Caddy's container (deploy/compose.yaml).
#
#   sudo install -m 644 deploy/systemd/60-idtrack-web.conf /etc/sysctl.d/ && sudo sysctl --system
net.ipv4.tcp_tw_reuse = 1
net.ipv4.ip_local_port_range = 1024 65535
