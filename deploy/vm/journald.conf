# The bounds of the system journal on the virtual machine (SETUP.md, section 10.9):
#   sudo install -D -m 644 deploy/vm/journald.conf /etc/systemd/journald.conf.d/idtrack-web.conf
#   sudo systemctl restart systemd-journald
# Without it the journal may grow to 10 % of the file system (4 GB at most). The containers' logs are not in the
# journal: deploy/compose.yaml rotates them (logging).
[Journal]
SystemMaxUse=1G
SystemKeepFree=5G
MaxRetentionSec=3month
