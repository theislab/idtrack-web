# The certificate given by the institute instead of Let's Encrypt: added after vm/compose.vm.yaml through
# COMPOSE_FILE in deploy/.env (SETUP.md, section 10.5). IDTRACK_WEB_TLS_DIR holds cert.pem and key.pem.
services:
  caddy:
    volumes:
      - ./vm/Caddyfile.institute-cert:/etc/caddy/Caddyfile:ro
      - ${IDTRACK_WEB_TLS_DIR:?set IDTRACK_WEB_TLS_DIR in deploy/.env to the folder of cert.pem and key.pem}:/etc/caddy/tls:ro
