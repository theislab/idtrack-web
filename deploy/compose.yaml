# idtrack-web on the owner's Hetzner node: the api (with the built frontend) behind Caddy, which obtains and renews
# the TLS certificate. SETUP.md, "Deploying", gives the steps.
#
#   cp deploy/idtrack-web.env.example deploy/idtrack-web.env   # then fill it in (it stays on the node)
#   IDTRACK_WEB_IMAGE=idtrack-web:<tag> IDTRACK_WEB_DOMAIN=<domain> docker compose -f deploy/compose.yaml up -d

name: idtrack-web

services:
  api:
    image: ${IDTRACK_WEB_IMAGE:?set IDTRACK_WEB_IMAGE to the image to run, e.g. idtrack-web:0.1.2}
    restart: unless-stopped
    env_file:
      - idtrack-web.env
    environment:
      # Only Caddy, on this compose network, may name the client in X-Forwarded-For.
      IDTRACK_WEB_FORWARDED_ALLOW_IPS: 172.30.80.0/24
    volumes:
      # The fetched, verified graph files survive restarts (R2 is read again only for a new release).
      - graph-cache:/var/cache/idtrack-web
      # For IDTRACK_WEB_SOURCE=directory: the node's store, read only.
      - ${IDTRACK_WEB_STORE:-./empty-store}:/srv/store:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [web]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
    stop_grace_period: 40s

  caddy:
    image: docker.io/library/caddy:2.11.9
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      IDTRACK_WEB_DOMAIN: ${IDTRACK_WEB_DOMAIN:?set IDTRACK_WEB_DOMAIN to the site's domain name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]

networks:
  web:
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  graph-cache:
  caddy-data:
  caddy-config:
