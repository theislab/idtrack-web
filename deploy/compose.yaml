# idtrack-web on a server (the Helmholtz virtual machine, the Hetzner node): the api (with the built frontend) behind
# Caddy, which obtains and renews the TLS certificate. SETUP.md, sections 10 and 11, gives the steps.
#
#   cp deploy/idtrack-web.env.example deploy/idtrack-web.env   # the server's settings; fill in (it stays on the server)
#   cp deploy/compose.env.example deploy/.env                   # this file's settings: image, domain, store, overrides
#   cd deploy && sudo docker compose up -d
#
# Compose reads deploy/.env for the variables below (and COMPOSE_FILE, the override files of deploy/vm/ to add), so
# every later command (ps, logs, restart, up -d) is the same short one, run from deploy/.

name: idtrack-web

services:
  api:
    image: ${IDTRACK_WEB_IMAGE:?set IDTRACK_WEB_IMAGE to the image to run, idtrack-web:<version>}
    restart: unless-stopped
    env_file:
      - idtrack-web.env
    environment:
      # Only Caddy, on this compose network (by its IPv4 or its IPv6 address), may name the client in
      # X-Forwarded-For (and the scheme in X-Forwarded-Proto).
      IDTRACK_WEB_FORWARDED_ALLOW_IPS: 172.30.80.0/24,fd30:80::/64
      # The site's address, for the absolute links of /llms.txt.
      IDTRACK_WEB_PUBLIC_URL: https://${IDTRACK_WEB_DOMAIN:?set IDTRACK_WEB_DOMAIN to the site's domain name}
      # The way to https this Caddy file takes (SETUP.md, section 10.5), which /version reports: Caddy obtains the
      # certificate from Let's Encrypt (vm/compose.institute-cert.yaml and vm/compose.behind-proxy.yaml say theirs).
      IDTRACK_WEB_HTTPS_ROUTE: lets_encrypt
    volumes:
      # The fetched, verified graph files survive restarts (R2 is read again only for a new release).
      - graph-cache:/var/cache/idtrack-web
      # For IDTRACK_WEB_SOURCE=directory: the node's store, read only.
      - ${IDTRACK_WEB_STORE:-./empty-store}:/srv/store:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [web]
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      # During the start period the check runs every 5 s, so the api is seen healthy within 5 s of being ready
      # (and Caddy started) instead of up to 30 s later.
      start_interval: 5s
      retries: 3
    stop_grace_period: 40s
    # The container's log is rotated: at most 5 files of 20 MB (one line per request; SETUP.md, section 10.9).
    logging: &logging
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    # Caddy's 2.11 line: each of its releases (the security fixes of Caddy, Go and the TLS stack among them) is
    # pulled by the weekly refresh (deploy/vm/refresh_images.sh), without a new version of idtrack-web.
    image: docker.io/library/caddy:2.11
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      IDTRACK_WEB_DOMAIN: ${IDTRACK_WEB_DOMAIN:?set IDTRACK_WEB_DOMAIN to the site's domain name}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # The api closes every connection after its answer, so Caddy opens one per request, and each leaves a socket
    # waiting out TCP's TIME_WAIT (60 s) in Caddy's network namespace. With Linux's default 28,232 local ports that
    # caps the rate at about 470 requests a second, past which Caddy answers 502 ("cannot assign requested address":
    # measured at 560 a second on the virtual machine). Reusing such sockets for new connections (safe with TCP
    # timestamps) and the wider port range lift the cap.
    sysctls:
      net.ipv4.tcp_tw_reuse: 1
      net.ipv4.ip_local_port_range: "1024 65535"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The page Caddy answers with while the api cannot answer (the Caddyfile's handle_errors).
      - ./maintenance.html:/etc/caddy/maintenance.html:ro
      # Certificates, and the access and error logs (/data/logs: a file a day, seven days kept; the Caddyfile's log).
      - caddy-data:/data
      - caddy-config:/config
    # As the api, though Caddy faces the internet: its state is in the volumes, its root file system read-only, and
    # of root's powers it keeps only binding the ports below 1024.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [web]
    logging: *logging

networks:
  web:
    # IPv6 as well as IPv4, so that a visitor who comes over IPv6 reaches Caddy by its own address (Docker forwards
    # the published ports to the container's IPv6 address): on a network of IPv4 alone, Docker's proxy would hand
    # Caddy every IPv6 visitor as the network's gateway, one client for the allowances (SETUP.md, section 10.6).
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.80.0/24
        - subnet: fd30:80::/64

volumes:
  graph-cache:
  caddy-data:
  caddy-config:
